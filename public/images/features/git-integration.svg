<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" rx="12" fill="#111827" />
  <rect x="40" y="40" width="320" height="220" rx="8" fill="#1F2937" />
  
  <!-- Git Branch Graph -->
  <line x1="120" y1="80" x2="120" y2="220" stroke="#60A5FA" stroke-width="2" />
  <line x1="120" y1="120" x2="180" y2="120" stroke="#60A5FA" stroke-width="2" />
  <line x1="180" y1="120" x2="180" y2="180" stroke="#60A5FA" stroke-width="2" />
  <line x1="120" y1="160" x2="240" y2="160" stroke="#60A5FA" stroke-width="2" />
  <line x1="240" y1="160" x2="240" y2="220" stroke="#60A5FA" stroke-width="2" />
  <line x1="180" y1="180" x2="300" y2="180" stroke="#60A5FA" stroke-width="2" />
  <line x1="300" y1="180" x2="300" y2="220" stroke="#60A5FA" stroke-width="2" />
  
  <!-- Git Branch Nodes -->
  <circle cx="120" cy="80" r="8" fill="#3B82F6" />
  <circle cx="120" cy="120" r="8" fill="#3B82F6" />
  <circle cx="180" cy="120" r="8" fill="#3B82F6" />
  <circle cx="120" cy="160" r="8" fill="#3B82F6" />
  <circle cx="240" cy="160" r="8" fill="#10B981" />
  <circle cx="180" cy="180" r="8" fill="#3B82F6" />
  <circle cx="300" cy="180" r="8" fill="#EC4899" />
  <circle cx="120" cy="220" r="8" fill="#3B82F6" />
  <circle cx="240" cy="220" r="8" fill="#10B981" />
  <circle cx="300" cy="220" r="8" fill="#EC4899" />
  
  <!-- Branch Labels -->
  <text x="90" y="80" font-family="sans-serif" font-size="10" fill="#60A5FA" text-anchor="end">main</text>
  <text x="90" y="120" font-family="sans-serif" font-size="10" fill="#60A5FA" text-anchor="end">v1.0.0</text>
  <text x="210" y="160" font-family="sans-serif" font-size="10" fill="#10B981" text-anchor="end">feature</text>
  <text x="270" y="180" font-family="sans-serif" font-size="10" fill="#EC4899" text-anchor="end">hotfix</text>
  
  <!-- Code Editor Interface -->
  <rect x="320" y="60" width="30" height="200" fill="#374151" />
  <rect x="320" y="60" width="30" height="30" fill="#4B5563" />
  <path d="M335 75L330 80L335 85" stroke="#D1D5DB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M335 95L330 100L335 105" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M335 115L330 120L335 125" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M335 135L330 140L335 145" stroke="#EC4899" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="330" y="170" font-family="monospace" font-size="10" fill="#D1D5DB" text-anchor="middle">G</text>
  <text x="330" y="190" font-family="monospace" font-size="10" fill="#D1D5DB" text-anchor="middle">I</text>
  <text x="330" y="210" font-family="monospace" font-size="10" fill="#D1D5DB" text-anchor="middle">T</text>
  
  <!-- File Changes -->
  <rect x="130" y="220" width="100" height="30" rx="4" fill="#374151" />
  <text x="140" y="240" font-family="monospace" font-size="10" fill="#D1D5DB">+10 -5 file.js</text>
  
  <rect x="250" y="220" width="100" height="30" rx="4" fill="#374151" />
  <text x="260" y="240" font-family="monospace" font-size="10" fill="#D1D5DB">+3 -1 config.js</text>
  
  <!-- Git Icon -->
  <circle cx="70" cy="60" r="20" fill="url(#paint0_linear)" />
  <path d="M80 60L70 50L60 60L70 70L80 60Z" stroke="white" stroke-width="2" fill="none" />
  <circle cx="70" cy="60" r="3" fill="white" />
  <circle cx="60" cy="60" r="3" fill="white" />
  <circle cx="70" cy="70" r="3" fill="white" />
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="paint0_linear" x1="50" y1="40" x2="90" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316" />
      <stop offset="1" stop-color="#EC4899" />
    </linearGradient>
  </defs>
</svg>
