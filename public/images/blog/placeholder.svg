<svg width="400" height="225" viewBox="0 0 400 225" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="225" fill="#1F2937"/>
  <rect x="50" y="50" width="300" height="125" rx="5" fill="#374151"/>
  
  <!-- Code Editor Window -->
  <rect x="60" y="60" width="280" height="105" rx="3" fill="#111827"/>
  
  <!-- Window Controls -->
  <circle cx="70" cy="70" r="3" fill="#EF4444"/>
  <circle cx="80" cy="70" r="3" fill="#FBBF24"/>
  <circle cx="90" cy="70" r="3" fill="#10B981"/>
  
  <!-- Code Lines -->
  <rect x="70" y="85" width="120" height="5" rx="1" fill="#60A5FA" opacity="0.7"/>
  <rect x="70" y="95" width="180" height="5" rx="1" fill="#8B5CF6" opacity="0.7"/>
  <rect x="70" y="105" width="160" height="5" rx="1" fill="#EC4899" opacity="0.7"/>
  <rect x="70" y="115" width="200" height="5" rx="1" fill="#F59E0B" opacity="0.7"/>
  <rect x="70" y="125" width="140" height="5" rx="1" fill="#10B981" opacity="0.7"/>
  <rect x="70" y="135" width="190" height="5" rx="1" fill="#D1D5DB" opacity="0.7"/>
  <rect x="70" y="145" width="110" height="5" rx="1" fill="#EC4899" opacity="0.7"/>
  
  <!-- Cursor -->
  <rect x="185" y="115" width="2" height="5" fill="#F9FAFB"/>
  
  <text x="200" y="190" font-family="sans-serif" font-size="14" fill="#D1D5DB" text-anchor="middle">MyCyberBase Blog</text>
  <text x="200" y="210" font-family="sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">AI-Powered Coding Insights</text>
</svg>
