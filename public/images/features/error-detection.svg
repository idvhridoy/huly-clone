<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" rx="12" fill="#111827" />
  <rect x="40" y="40" width="320" height="220" rx="8" fill="#1F2937" />
  
  <!-- Code Editor Simulation -->
  <rect x="60" y="70" width="280" height="160" rx="4" fill="#374151" />
  
  <!-- Line Numbers -->
  <rect x="60" y="70" width="30" height="160" fill="#4B5563" />
  <text x="75" y="90" font-family="monospace" font-size="12" fill="#9CA3AF">1</text>
  <text x="75" y="110" font-family="monospace" font-size="12" fill="#9CA3AF">2</text>
  <text x="75" y="130" font-family="monospace" font-size="12" fill="#9CA3AF">3</text>
  <text x="75" y="150" font-family="monospace" font-size="12" fill="#9CA3AF">4</text>
  <text x="75" y="170" font-family="monospace" font-size="12" fill="#9CA3AF">5</text>
  <text x="75" y="190" font-family="monospace" font-size="12" fill="#9CA3AF">6</text>
  <text x="75" y="210" font-family="monospace" font-size="12" fill="#9CA3AF">7</text>
  
  <!-- Code Content with Error -->
  <text x="100" y="90" font-family="monospace" font-size="12" fill="#D1D5DB">function calculateTotal(items) {</text>
  <text x="100" y="110" font-family="monospace" font-size="12" fill="#D1D5DB">  let total = 0;</text>
  <text x="100" y="130" font-family="monospace" font-size="12" fill="#D1D5DB">  for (let i = 0; i &lt; items.length; i++) {</text>
  <text x="100" y="150" font-family="monospace" font-size="12" fill="#F87171">    total += items[i].price;</text>
  <text x="100" y="170" font-family="monospace" font-size="12" fill="#D1D5DB">  }</text>
  <text x="100" y="190" font-family="monospace" font-size="12" fill="#D1D5DB">  return total;</text>
  <text x="100" y="210" font-family="monospace" font-size="12" fill="#D1D5DB">}</text>
  
  <!-- Error Highlight -->
  <rect x="145" y="142" width="100" height="16" rx="2" fill="#7F1D1D" fill-opacity="0.3" />
  <path d="M152 142L142 152" stroke="#F87171" stroke-width="2" stroke-linecap="round" />
  <path d="M142 142L152 152" stroke="#F87171" stroke-width="2" stroke-linecap="round" />
  
  <!-- Error Message -->
  <rect x="100" y="217" width="230" height="30" rx="4" fill="#7F1D1D" fill-opacity="0.3" stroke="#F87171" stroke-width="1" />
  <text x="110" y="237" font-family="monospace" font-size="12" fill="#F87171">TypeError: Cannot read property 'price' of undefined</text>
  
  <!-- Warning Icon -->
  <circle cx="200" cy="40" r="20" fill="url(#paint0_linear)" />
  <path d="M200 30V42" stroke="white" stroke-width="2" stroke-linecap="round" />
  <circle cx="200" cy="48" r="1.5" fill="white" />
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="paint0_linear" x1="180" y1="20" x2="220" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EF4444" />
      <stop offset="1" stop-color="#B91C1C" />
    </linearGradient>
  </defs>
</svg>
